name: MCP review workbench
on:
  push:
    branches: [codex/platform-mcp-shared-toolkit]
    paths: [.github/workflows/mcp-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prepare isolated native verification binaries
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cp "$(command -v node)" "$RUNNER_TEMP/tools/node"
          npm install --prefix "$RUNNER_TEMP/native" opencode-ai@1.18.31
          native=$(find "$RUNNER_TEMP/native/node_modules" -type f -path '*/bin/opencode' ! -path '*/opencode-ai/*' | head -n 1)
          test -n "$native"
          cp "$native" "$RUNNER_TEMP/tools/opencode"
          tar -czf "$RUNNER_TEMP/native-tools.tar.gz" -C "$RUNNER_TEMP/tools" .
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-native-tools
          path: ${{ runner.temp }}/native-tools.tar.gz
          retention-days: 1
